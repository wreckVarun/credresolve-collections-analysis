<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 660" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
  <rect width="1080" height="660" fill="#f6f6f4"/>

  <text x="34" y="40" font-size="19" font-weight="600" fill="#14171a">Collections analytics — production design</text>
  <text x="34" y="60" font-size="12" fill="#6f7377">Raw → Staging → Clean → Golden → Feature / Metrics → Dashboard, with a blocking quality gate</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,1 L8,4.5 L0,8" fill="none" stroke="#6f7377" stroke-width="1.4"/>
    </marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,1 L8,4.5 L0,8" fill="none" stroke="#a83229" stroke-width="1.4"/>
    </marker>
  </defs>

  <!-- ============ SOURCES ============ -->
  <text x="34" y="98" font-size="10.5" font-weight="600" fill="#6f7377">SOURCE SYSTEMS</text>
  <g fill="#ffffff" stroke="#dcdbd6">
    <rect x="34" y="108" width="132" height="27"/>
    <rect x="34" y="140" width="132" height="27"/>
    <rect x="34" y="172" width="132" height="27"/>
    <rect x="34" y="204" width="132" height="27"/>
    <rect x="34" y="236" width="132" height="27"/>
    <rect x="34" y="268" width="132" height="27"/>
  </g>
  <g font-size="11.5" fill="#14171a">
    <text x="46" y="126">Loan mgmt system</text>
    <text x="46" y="158">Dialler / telephony</text>
    <text x="46" y="190">WhatsApp + SMS</text>
    <text x="46" y="222">Field visit app</text>
    <text x="46" y="254">Payment gateways</text>
    <text x="46" y="286">CRM / complaints</text>
  </g>
  <text x="34" y="308" font-size="9.5" fill="#6f7377">15 min streams · hourly batch</text>

  <!-- ============ RAW ============ -->
  <text x="206" y="98" font-size="10.5" font-weight="600" fill="#6f7377">RAW</text>
  <rect x="206" y="108" width="128" height="155" fill="#eceae5" stroke="#dcdbd6"/>
  <text x="218" y="128" font-size="12" font-weight="600" fill="#14171a">Immutable</text>
  <g font-size="10.5" fill="#4b4f53">
    <text x="218" y="147">append-only</text>
    <text x="218" y="163">partitioned by</text>
    <text x="218" y="177">ingest date</text>
    <text x="218" y="197">no transforms</text>
    <text x="218" y="217">replay source</text>
    <text x="218" y="231">of truth for</text>
    <text x="218" y="245">every backfill</text>
  </g>

  <!-- ============ STAGING ============ -->
  <text x="374" y="98" font-size="10.5" font-weight="600" fill="#6f7377">STAGING</text>
  <rect x="374" y="108" width="128" height="155" fill="#ffffff" stroke="#dcdbd6"/>
  <text x="386" y="128" font-size="12" font-weight="600" fill="#14171a">Typed</text>
  <g font-size="10.5" fill="#4b4f53">
    <text x="386" y="147">explicit casts</text>
    <text x="386" y="163">lineage columns</text>
    <text x="386" y="179">MD5 row hash</text>
    <text x="386" y="199">faithful mirror</text>
    <text x="386" y="213">of source</text>
    <text x="386" y="233">no business</text>
    <text x="386" y="247">logic at all</text>
  </g>

  <!-- ============ CLEAN ============ -->
  <text x="542" y="98" font-size="10.5" font-weight="600" fill="#6f7377">CLEAN</text>
  <rect x="542" y="108" width="128" height="155" fill="#ffffff" stroke="#dcdbd6"/>
  <text x="554" y="128" font-size="12" font-weight="600" fill="#14171a">Resolved</text>
  <g font-size="10.5" fill="#4b4f53">
    <text x="554" y="147">2-stage dedup</text>
    <text x="554" y="163">entity resolution</text>
    <text x="554" y="179">tz → Asia/Kolkata</text>
    <text x="554" y="195">enum harmonised</text>
    <text x="554" y="215">defects flagged,</text>
    <text x="554" y="229">not silently</text>
    <text x="554" y="243">overwritten</text>
  </g>

  <!-- ============ GOLDEN ============ -->
  <text x="710" y="98" font-size="10.5" font-weight="600" fill="#6f7377">GOLDEN</text>
  <rect x="710" y="108" width="128" height="155" fill="#14171a"/>
  <text x="722" y="128" font-size="12" font-weight="600" fill="#f2f2ef">account_month</text>
  <g font-size="10.5" fill="#c8ccce">
    <text x="722" y="147">one row per</text>
    <text x="722" y="161">account per month</text>
    <text x="722" y="181">fixed denominator:</text>
    <text x="722" y="195">all 30,000 accounts</text>
    <text x="722" y="215">immune to</text>
    <text x="722" y="229">denominator</text>
    <text x="722" y="243">manipulation</text>
  </g>

  <!-- ============ FEATURE / METRICS ============ -->
  <text x="878" y="98" font-size="10.5" font-weight="600" fill="#6f7377">FEATURE / METRICS</text>
  <rect x="878" y="108" width="168" height="70" fill="#ffffff" stroke="#dcdbd6"/>
  <text x="890" y="128" font-size="12" font-weight="600" fill="#14171a">Semantic layer</text>
  <g font-size="10.5" fill="#4b4f53">
    <text x="890" y="146">every metric defined once</text>
    <text x="890" y="162">day-normalised by default</text>
  </g>

  <rect x="878" y="193" width="168" height="70" fill="#ffffff" stroke="#dcdbd6"/>
  <text x="890" y="213" font-size="12" font-weight="600" fill="#14171a">Feature store</text>
  <g font-size="10.5" fill="#4b4f53">
    <text x="890" y="231">rolling account windows</text>
    <text x="890" y="247">feeds targeting model</text>
  </g>

  <!-- flow arrows -->
  <g stroke="#6f7377" stroke-width="1.3" fill="none" marker-end="url(#a)">
    <line x1="168" y1="186" x2="202" y2="186"/>
    <line x1="336" y1="186" x2="370" y2="186"/>
    <line x1="504" y1="186" x2="538" y2="186"/>
    <line x1="672" y1="186" x2="706" y2="186"/>
    <line x1="840" y1="150" x2="874" y2="143"/>
    <line x1="840" y1="222" x2="874" y2="228"/>
  </g>

  <!-- ============ QUALITY GATE ============ -->
  <rect x="542" y="300" width="296" height="128" fill="#ffffff" stroke="#a83229" stroke-width="1.6"/>
  <text x="556" y="322" font-size="12.5" font-weight="600" fill="#a83229">Data quality gate — blocking</text>
  <text x="556" y="340" font-size="10.5" fill="#6f7377">A failure holds the previous golden snapshot live.</text>
  <g font-size="10.5" fill="#14171a">
    <text x="556" y="360">Primary-key uniqueness, every table</text>
    <text x="556" y="376">Row count vs 28-day median, ±3σ</text>
    <text x="556" y="392">Referential integrity on all foreign keys</text>
    <text x="556" y="408">Recovery total vs finance ledger, ±0.5%</text>
  </g>
  <g stroke="#a83229" stroke-width="1.4" fill="none" marker-end="url(#ar)">
    <line x1="690" y1="296" x2="690" y2="268" transform="rotate(180 690 282)"/>
    <line x1="774" y1="300" x2="774" y2="270"/>
  </g>
  <text x="700" y="288" font-size="9.5" fill="#a83229">gate sits between clean and golden</text>

  <!-- ============ WARNING CHECKS ============ -->
  <rect x="878" y="300" width="168" height="128" fill="#ffffff" stroke="#dcdbd6"/>
  <text x="890" y="322" font-size="12" font-weight="600" fill="#14171a">Warning checks</text>
  <g font-size="10.5" fill="#4b4f53">
    <text x="890" y="342">enum drift</text>
    <text x="890" y="358">NULL rate shift &gt; 5pp</text>
    <text x="890" y="374">cross-column logic</text>
    <text x="890" y="390">freshness &lt; 24h</text>
    <text x="890" y="406">dedup removal rate</text>
  </g>

  <!-- ============ CONSUMERS ============ -->
  <text x="34" y="474" font-size="10.5" font-weight="600" fill="#6f7377">CONSUMERS</text>
  <rect x="34" y="484" width="196" height="72" fill="#14171a"/>
  <text x="46" y="506" font-size="12" font-weight="600" fill="#f2f2ef">Executive dashboard</text>
  <g font-size="10.5" fill="#c8ccce">
    <text x="46" y="524">rebuilt 06:00, live by 07:00 IST</text>
    <text x="46" y="540">renders only day-normalised trends</text>
  </g>

  <rect x="246" y="484" width="196" height="72" fill="#ffffff" stroke="#dcdbd6"/>
  <text x="258" y="506" font-size="12" font-weight="600" fill="#14171a">Targeting model</text>
  <g font-size="10.5" fill="#4b4f53">
    <text x="258" y="524">downstream of golden only</text>
    <text x="258" y="540">never an input to a metric</text>
  </g>

  <rect x="458" y="484" width="196" height="72" fill="#ffffff" stroke="#dcdbd6"/>
  <text x="470" y="506" font-size="12" font-weight="600" fill="#14171a">Alerting</text>
  <g font-size="10.5" fill="#4b4f53">
    <text x="470" y="524">robust z-score, |z| &gt; 3</text>
    <text x="470" y="540">PSI &gt; 0.2 on portfolio mix</text>
  </g>

  <rect x="670" y="484" width="196" height="72" fill="#ffffff" stroke="#dcdbd6"/>
  <text x="682" y="506" font-size="12" font-weight="600" fill="#14171a">Finance reconciliation</text>
  <g font-size="10.5" fill="#4b4f53">
    <text x="682" y="524">daily 02:00, blocking</text>
    <text x="682" y="540">the check that matters most</text>
  </g>

  <g stroke="#6f7377" stroke-width="1.3" fill="none" marker-end="url(#a)">
    <line x1="774" y1="432" x2="774" y2="480"/>
    <line x1="962" y1="432" x2="962" y2="460"/>
    <path d="M962,460 L962,470 L560,470 L560,480"/>
  </g>

  <!-- ============ LATE DATA ============ -->
  <rect x="34" y="330" width="466" height="98" fill="#eceae5" stroke="#dcdbd6"/>
  <text x="48" y="352" font-size="12" font-weight="600" fill="#14171a">Incremental processing and late-arriving data</text>
  <g font-size="10.5" fill="#4b4f53">
    <text x="48" y="372">Facts incremental on event_at, partitioned by month, 7-day reprocessing window.</text>
    <text x="48" y="388">Late facts inside 7 days absorbed automatically; older ones trigger a dated backfill.</text>
    <text x="48" y="404">Late dimensions: fact loads with a placeholder key, reconciled next run — never dropped.</text>
    <text x="48" y="420">Closed months are immutable; corrections publish as visible restatements, not silent edits.</text>
  </g>

  <line x1="34" y1="586" x2="1046" y2="586" stroke="#dcdbd6"/>
  <text x="34" y="606" font-size="10.5" fill="#6f7377">Design constraint: the failure this analysis uncovered was not analytical — it was a missing assertion. Contracts and monitoring are prioritised over sophistication.</text>
  <text x="34" y="624" font-size="10.5" fill="#6f7377">Deliberately excluded: real-time recovery metrics, ML in the critical path, and any channel attribution model until the holdout experiment reads out.</text>
</svg>
